<h2>Daily Targets</h2>

{% for target in targets %}
<div class="card p-3 mb-2">
    <h4>{{ target.get_service_type_display }}</h4>
    <p>Target: {{ target.target_number }}</p>
    <p>Achieved: {{ target.achieved }}</p>
    <p>Percentage: {{ target.percentage }}%</p>
    <p>Remaining: {{ target.remaining }}</p>
</div>
{% endfor %}

<hr>

<h3>Record Service</h3>

<form method="POST">
    {% csrf_token %}

    <select name="service_type" required>
        <option value="sim_registration">SIM Registration</option>
        <option value="sim_swap">SIM Swap</option>
        <option value="sim_upgrade">SIM Upgrade</option>
        <option value="gotv">GOTV</option>
        <option value="dstv">DSTV</option>
    </select>

    <input type="number" name="quantity" placeholder="Quantity" required>

    <select name="device_tag">
        <option value="">Select Device (Only SIM Registration)</option>
        {% for tag in device_tags %}
        <option value="{{ tag.id }}">{{ tag.tag_name }}</option>
        {% endfor %}
    </select>

    <button type="submit">Submit</button>
</form>
