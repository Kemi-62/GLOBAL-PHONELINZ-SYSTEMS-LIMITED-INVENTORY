{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;text-align:center;">
  <div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:12px;padding:2rem;">
    <div style="font-size:2.5rem;margin-bottom:.5rem;">🔑</div>
    <h2 style="font-size:1.1rem;font-weight:700;color:#065f46;margin:0 0 .5rem;">Password Reset Complete</h2>
    <p style="font-size:.85rem;color:#065f46;">Your password has been updated.</p>
    <a href="{% url 'login' %}" style="display:inline-block;margin-top:1rem;padding:.55rem 1.2rem;background:#004F9F;color:#fff;border-radius:7px;font-weight:600;text-decoration:none;font-size:.88rem;">Login Now</a>
  </div>
</div>
