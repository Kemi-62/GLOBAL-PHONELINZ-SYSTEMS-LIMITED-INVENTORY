{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem;">
    <h2 style="font-size:1.2rem;font-weight:700;color:#004F9F;margin:0 0 1rem;">Set New Password</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="width:100%;padding:.65rem;background:#004F9F;color:#fff;border:none;border-radius:7px;font-weight:600;cursor:pointer;margin-top:.8rem;">Set Password</button>
    </form>
  </div>
</div>
{% endblock %}
