{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;text-align:center;">
  <div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:12px;padding:2rem;">
    <div style="font-size:2.5rem;margin-bottom:.5rem;">✅</div>
    <h2 style="font-size:1.1rem;font-weight:700;color:#065f46;margin:0 0 .5rem;">Check Your Email</h2>
    <p style="font-size:.85rem;color:#065f46;">A password reset link has been sent. Check your inbox and follow the instructions.</p>
    <a href="{% url 'login' %}" style="display:inline-block;margin-top:1rem;font-size:.82rem;color:#004F9F;">← Back to Login</a>
  </div>
</div>
{% endblock %}
