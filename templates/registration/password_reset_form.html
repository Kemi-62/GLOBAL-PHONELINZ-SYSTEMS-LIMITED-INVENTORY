{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem;">
    <h2 style="font-size:1.2rem;font-weight:700;color:#004F9F;margin:0 0 .5rem;">Reset Your Password</h2>
    <p style="font-size:.85rem;color:#6b7280;margin:0 0 1.5rem;">Enter your email address and we will send you a reset link.</p>
    <form method="POST">
      {% csrf_token %}
      <div style="margin-bottom:1rem;">
        <label style="font-size:.78rem;font-weight:600;color:#374151;display:block;margin-bottom:.3rem;">Email Address</label>
        <input type="email" name="email" required style="width:100%;padding:.55rem .8rem;border:1px solid #d1d5db;border-radius:7px;font-size:.88rem;box-sizing:border-box;">
      </div>
      <button type="submit" style="width:100%;padding:.65rem;background:#004F9F;color:#fff;border:none;border-radius:7px;font-weight:600;font-size:.9rem;cursor:pointer;">Send Reset Link</button>
    </form>
    <div style="text-align:center;margin-top:1rem;">
      <a href="{% url 'login' %}" style="font-size:.82rem;color:#004F9F;">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
