name: GPSL Daily Digest

on:
  schedule:
    - cron: '0 18 * * 1-6'
  workflow_dispatch:

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          echo "Waking app..."
          curl -s --max-time 60 "https://app.globalphonelinz.com/system/keepalive/" || true
          sleep 15
      - name: Send daily digest
        run: |
          echo "Sending digest..."
          curl -s --max-time 120 \
            "https://app.globalphonelinz.com/cron/daily-digest/?email=kemimonday00@gmail.com&key=gpsl2026backup"
          echo "Done"
