# ROLES_V3
name: GPSL Sub Director Weekly

on:
  schedule:
    # Monday 06:00 UTC = 7:00 am Lagos (WAT)
    - cron: '26 6 * * 1'
  workflow_dispatch:

jobs:
  sub-director-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          curl -s --max-time 60 "https://app.globalphonelinz.com/system/keepalive/" || true
          sleep 15
      - name: Send Sub Director weekly email
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "CRON_KEY secret is not set (GitHub repo > Settings > Secrets and variables > Actions)"
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 20 --retry-all-errors --max-time 120 \
            -H "X-Cron-Secret: $CRON_KEY" \
            "https://app.globalphonelinz.com/cron/sub-director-weekly/?email=kemimonday00@gmail.com"
