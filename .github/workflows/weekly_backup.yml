# CRON_KEY_SECRET_V1
name: GPSL Weekly Backup

on:
  schedule:
    - cron: '30 17 * * 6'
  workflow_dispatch:

jobs:
  weekly-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          curl -s --max-time 60 "https://app.globalphonelinz.com/system/keepalive/" || true
          sleep 15
      - name: Run weekly backup
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "CRON_KEY secret is not set (GitHub repo > Settings > Secrets and variables > Actions)"
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 20 --retry-all-errors --max-time 240 \
            -H "X-Cron-Secret: $CRON_KEY" \
            "https://app.globalphonelinz.com/cron/backup/?upload=true"
