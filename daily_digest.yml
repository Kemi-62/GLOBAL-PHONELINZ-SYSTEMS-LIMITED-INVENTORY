name: GPSL Daily Digest

on:
  schedule:
    - cron: '0 18 * * 1-6'
  workflow_dispatch:

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          echo "Waking app..."
          curl -s --max-time 60 "${{ secrets.RENDER_APP_URL }}/system/keepalive/" || true
          sleep 15
      - name: Send daily digest
        run: |
          echo "Sending digest..."
          curl -s --max-time 120 \
            "${{ secrets.RENDER_APP_URL }}/cron/daily-digest/?email=${{ secrets.ALERT_EMAIL }}&secret=${{ secrets.BACKUP_SECRET_KEY }}"
          echo "Done"
