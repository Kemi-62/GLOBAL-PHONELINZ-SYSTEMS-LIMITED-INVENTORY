name: GPSL Stock Alert

on:
  schedule:
    - cron: '0 8 * * 1-6'
  workflow_dispatch:

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render app
        run: |
          echo "Waking app..."
          curl -s --max-time 60 "${{ secrets.RENDER_APP_URL }}/system/keepalive/" || true
          sleep 15
      - name: Send stock and subscription alerts
        run: |
          echo "Sending alerts..."
          curl -s --max-time 120 \
            "${{ secrets.RENDER_APP_URL }}/cron/stock-alert/?email=${{ secrets.ALERT_EMAIL }}&secret=${{ secrets.BACKUP_SECRET_KEY }}"
          echo "Done"
